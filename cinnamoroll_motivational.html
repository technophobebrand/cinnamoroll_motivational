<!DOCTYPE html>

  <!-- Google Fonts: Fredoka & Quicksand for maximum kawaii vibe -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#bde0fe">
  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      background-color: #f0f7ff;
      /* Soft gingham grid pattern with floral accent backgrounds */
      background-image: 
        linear-gradient(90deg, rgba(255, 255, 255, 0.6) 50%, transparent 50%),
        linear-gradient(rgba(255, 255, 255, 0.6) 50%, transparent 50%);
      background-size: 36px 36px;
    }

    h1, h2, h3, .heading-font {
      font-family: 'Fredoka', cursive, sans-serif;
    }

    /* Custom Checkbox Animation & Styling */
    .custom-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 28px;
      height: 28px;
      border: 2.5px solid currentColor;
      border-radius: 10px;
      outline: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      background-color: #ffffff;
      flex-shrink: 0;
      position: relative;
    }

    .custom-checkbox:hover {
      transform: scale(1.08);
    }

    .custom-checkbox:checked {
      background-color: currentColor;
      transform: scale(1.05);
    }

    .custom-checkbox:checked::after {
      content: '✓';
      color: white;
      font-size: 19px;
      font-weight: 800;
      display: block;
      line-height: 1;
      animation: popCheck 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popCheck {
      0% { transform: scale(0) rotate(-20deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    /* Strikethrough effect when item is checked */
    .todo-item:has(input:checked) .item-text {
      text-decoration: line-through;
      opacity: 0.55;
    }

    /* Floating mascot animation */
    @keyframes floaty {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(-3deg); }
    }
    .animate-float {
      animation: floaty 4s ease-in-out infinite;
    }

    /* Subtle pulse animation for stars & flowers */
    @keyframes gentlePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    .animate-pulse-slow {
      animation: gentlePulse 3s ease-in-out infinite;
    }
  </style>
</head>

  <!-- JavaScript for LocalStorage Caching -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const STORAGE_KEY = 'cinnamoroll_todo_state_v1';
      const checkboxes = document.querySelectorAll('input[type="checkbox"]');
      const resetBtn = document.getElementById('resetBtn');

      // 1. Load saved state from LocalStorage on page load
      function loadSavedState() {
        try {
          const savedData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
          checkboxes.forEach(cb => {
            if (cb.id && savedData[cb.id] !== undefined) {
              cb.checked = savedData[cb.id];
            }
          });
        } catch (e) {
          console.error('Could not load saved todo states', e);
        }
      }

      // 2. Save current state to LocalStorage
      function saveState() {
        const state = {};
        checkboxes.forEach(cb => {
          if (cb.id) {
            state[cb.id] = cb.checked;
          }
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      // 3. Attach change listener to each checkbox
      checkboxes.forEach(cb => {
        cb.addEventListener('change', saveState);
      });

      // 4. Hook up Reset Button
      resetBtn.addEventListener('click', () => {
        checkboxes.forEach(cb => {
          cb.checked = false;
        });
        localStorage.removeItem(STORAGE_KEY);
      });

      // Initial state load
      loadSavedState();
    });
  </script>
